# Her push ve pull request'te yerelde çalışan `npm run kontrol` zincirinin tamamı:
# tip kontrolü, lint ve biçim, katman kuralları, kullanılmayan kod ve kapsam eşikli testler.
name: Kontrol

on:
  push:
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci
        env:
          # Commit öncesi kanca yalnızca geliştiricinin bilgisayarında kurulur.
          HUSKY: '0'

      - name: Kalite kapıları (npm run kontrol)
        run: npm run kontrol

      - name: Kapsam raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapsam-raporu
          path: app/coverage/
          if-no-files-found: ignore
