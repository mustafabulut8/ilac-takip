<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary-container": "#003731", "inverse-on-surface": "#f3f0ef", "outline": "#6d7a77", "inverse-primary": "#73d8c8", "primary-fixed": "#90f4e4", "on-secondary-fixed": "#002020", "surface-dim": "#dcd9d9", "secondary-container": "#9eeded", "on-secondary-container": "#0f6e6e", "on-error": "#ffffff", "surface-container-highest": "#e5e2e1", "on-tertiary-fixed": "#002204", "surface-bright": "#fcf9f8", "on-primary-fixed": "#00201c", "on-primary-fixed-variant": "#005048", "on-tertiary": "#ffffff", "outline-variant": "#bdc9c6", "tertiary-fixed-dim": "#88d982", "inverse-surface": "#313030", "on-secondary": "#ffffff", "surface-container-high": "#eae7e7", "tertiary-container": "#5aa958", "surface-container": "#f0eded", "on-error-container": "#93000a", "on-tertiary-container": "#003909", "on-tertiary-fixed-variant": "#005312", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#85d4d3", "secondary": "#03696a", "on-primary": "#ffffff", "surface-tint": "#006a60", "error": "#ba1a1a", "primary-fixed-dim": "#73d8c8", "on-surface": "#1c1b1b", "secondary-fixed": "#a1f0ef", "primary": "#006a60", "on-surface-variant": "#3d4947", "primary-container": "#3fa89a", "on-background": "#1c1b1b", "background": "#fcf9f8", "on-secondary-fixed-variant": "#004f50", "error-container": "#ffdad6", "surface": "#fcf9f8", "tertiary-fixed": "#a3f69c", "surface-variant": "#e5e2e1", "surface-container-low": "#f6f3f2", "tertiary": "#1b6d24" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-lg": "1.25rem", "space-xl": "1.75rem", "margin": "1.25rem", "space-md": "1rem" }, fontFamily: { "label-md": ["Inter"], "body-md-bold": ["Inter"], "body-lg": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-lg": ["Inter"], "caption": ["Inter"], "headline-lg": ["Inter"] }, fontSize: { "label-md": ["16px", { lineHeight: "22px", fontWeight: "600" }], "body-md-bold": ["18px", { lineHeight: "26px", fontWeight: "600" }], "body-lg": ["20px", { lineHeight: "28px", fontWeight: "500" }], "headline-sm": ["22px", { lineHeight: "30px", fontWeight: "600" }], "headline-md": ["26px", { lineHeight: "34px", fontWeight: "700" }], "body-md": ["18px", { lineHeight: "26px", fontWeight: "400" }], "label-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }], "caption": ["16px", { lineHeight: "22px", fontWeight: "500" }], "headline-lg": ["30px", { lineHeight: "38px", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-[#F7F7F5] font-body-md text-on-surface antialiased" style="background-color: #F7F7F5 !important;"><main class="flex flex-col relative w-full min-h-screen bg-[#F7F7F5] px-margin pt-safe pb-safe" style="background-color: #F7F7F5 !important;"><div class="flex flex-col w-full pb-8">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between w-full pt-2 pb-4">
<button aria-label="Geri dön" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm text-on-surface active:bg-surface-container transition-colors" style="background-color: #FFFFFF !important;" type="button">
<span class="material-symbols-outlined text-[28px] text-on-secondary-container" style="color: #0F6E6E !important;">arrow_back</span>
</button>
</div>
<!-- Reassuring Header Section -->
<header class="flex flex-col mt-2 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-2">
      Hesap oluştur
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
      Adınızı uygulamada size seslenmek ve ilaç hatırlatmalarınızı kişiselleştirmek için kullanacağız.
    </p>
</header>
<!-- Registration Form -->
<form class="flex flex-col gap-5 w-full" onsubmit="event.preventDefault();">
<!-- Field: Name -->
<div class="flex flex-col gap-2">
<label class="font-body-md-bold text-body-md-bold text-on-surface flex items-center justify-between" for="reg-name">
<span>Adınız</span>
<span class="font-caption text-caption text-on-surface-variant font-normal">Gerekli</span>
</label>
<div class="relative w-full rounded-xl bg-surface-container-lowest shadow-sm flex items-center border-[1.5px] border-[#BFC8C6] focus-within:border-[#0F6E6E] focus-within:border-2 transition-all" style="background: #FFFFFF !important; border: 1.5px solid #BFC8C6 !important;"><input autocomplete="name" class="w-full h-14 px-5 rounded-xl bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none focus:bg-surface-bright transition-all" id="reg-name" placeholder="Örn. Mustafa" style="background-color: #FFFFFF !important;" type="text"/></div>
</div>
<!-- Field: Email -->
<div class="flex flex-col gap-2">
<label class="font-body-md-bold text-body-md-bold text-on-surface flex items-center justify-between" for="reg-email">
<span>E-posta adresiniz</span>
<span class="font-caption text-caption text-on-surface-variant font-normal">Gerekli</span>
</label>
<div class="relative w-full rounded-xl bg-surface-container-lowest shadow-sm flex items-center border-[1.5px] border-[#BFC8C6] focus-within:border-[#0F6E6E] focus-within:border-2 transition-all" style="background: #FFFFFF !important; border: 1.5px solid #BFC8C6 !important;"><input autocomplete="email" class="w-full h-14 px-5 rounded-xl bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none focus:bg-surface-bright transition-all" id="reg-email" inputmode="email" placeholder="ornek@mail.com" style="background-color: #FFFFFF !important;" type="email"/></div>
</div>
<!-- Field: Password -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-body-md-bold text-body-md-bold text-on-surface" for="reg-password">
          Şifre
        </label>
</div>
<div class="relative w-full rounded-xl bg-surface-container-lowest shadow-sm flex items-center pr-3 border-[1.5px] border-[#BFC8C6] focus-within:border-[#0F6E6E] focus-within:border-2 transition-all" style="background: #FFFFFF !important; border: 1.5px solid #BFC8C6 !important;"><input class="flex-1 h-14 pl-5 pr-2 rounded-xl bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none focus:bg-surface-bright transition-all" id="reg-password" placeholder="En az 8 karakter" style="background-color: #FFFFFF !important;" type="password"/><button aria-label="Şifreyi göster veya gizle" class="flex items-center justify-center min-w-[48px] min-h-[48px] rounded-lg text-on-surface-variant hover:text-on-secondary-container active:scale-95 transition-all" id="togglePasswordBtn" type="button"><span class="material-symbols-outlined text-[26px]" id="passwordEyeIcon">visibility</span></button></div>
</div>
<!-- Accessible Consent Checkbox -->
<div class="mt-2 pt-1">
<label class="flex items-start gap-3.5 cursor-pointer select-none group min-h-[48px]">
<input class="sr-only peer" id="kvkk-checkbox" type="checkbox"/>
<div class="mt-1 flex-shrink-0 w-7 h-7 rounded-lg bg-surface-container-lowest shadow-sm border-2 border-[#3D4947] flex items-center justify-center peer-checked:bg-on-secondary-container peer-checked:border-on-secondary-container peer-checked:text-on-primary transition-colors" style="width: 28px; height: 28px; background: #FFFFFF !important; border: 2px solid #3D4947 !important;"><span class="material-symbols-outlined text-[22px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span></div>
<span class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
          Kişisel verilerimin işlenmesine ilişkin
          <a class="underline font-bold text-on-secondary-container active:opacity-75" href="#" style="color: #0F6E6E !important; text-decoration: underline;">KVKK Aydınlatma Metni</a>'ni okudum ve kabul ediyorum.
        </span>
</label>
</div>
<!-- Primary Action Button -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full h-14 rounded-xl bg-on-secondary-container text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary active:scale-[0.99] transition-all flex items-center justify-center gap-2" style="background-color: #0F6E6E !important; color: #FFFFFF !important; box-shadow: 0 4px 14px rgba(15, 110, 110, 0.28);" type="submit">
<span>Hesap oluştur</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
<!-- Bottom Alternative Action -->
<a class="flex items-center justify-center min-h-[48px] py-2 text-center font-body-md text-body-md text-on-secondary-container hover:underline active:opacity-75 transition-opacity" href="#" style="color: #0F6E6E !important;">
<span>Zaten hesabım var · <strong class="underline font-bold">Giriş yap</strong></span>
</a>
</div>
</form>
<!-- Gentle Assistance Reassurance Box -->
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('reg-password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>
</body></html>
