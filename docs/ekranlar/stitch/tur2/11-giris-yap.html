<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary-container": "#003731", "inverse-on-surface": "#f3f0ef", "outline": "#6d7a77", "inverse-primary": "#73d8c8", "primary-fixed": "#90f4e4", "on-secondary-fixed": "#002020", "surface-dim": "#dcd9d9", "secondary-container": "#9eeded", "on-secondary-container": "#0f6e6e", "on-error": "#ffffff", "surface-container-highest": "#e5e2e1", "on-tertiary-fixed": "#002204", "surface-bright": "#fcf9f8", "on-primary-fixed": "#00201c", "on-primary-fixed-variant": "#005048", "on-tertiary": "#ffffff", "outline-variant": "#bdc9c6", "tertiary-fixed-dim": "#88d982", "inverse-surface": "#313030", "on-secondary": "#ffffff", "surface-container-high": "#eae7e7", "tertiary-container": "#5aa958", "surface-container": "#f0eded", "on-error-container": "#93000a", "on-tertiary-container": "#003909", "on-tertiary-fixed-variant": "#005312", "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#85d4d3", "secondary": "#03696a", "on-primary": "#ffffff", "surface-tint": "#006a60", "error": "#ba1a1a", "primary-fixed-dim": "#73d8c8", "on-surface": "#1c1b1b", "secondary-fixed": "#a1f0ef", "primary": "#006a60", "on-surface-variant": "#3d4947", "primary-container": "#3fa89a", "on-background": "#1c1b1b", "background": "#fcf9f8", "on-secondary-fixed-variant": "#004f50", "error-container": "#ffdad6", "surface": "#fcf9f8", "tertiary-fixed": "#a3f69c", "surface-variant": "#e5e2e1", "surface-container-low": "#f6f3f2", "tertiary": "#1b6d24" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter": "1rem", "space-xs": "0.5rem", "space-sm": "0.75rem", "space-lg": "1.25rem", "space-xl": "1.75rem", "margin": "1.25rem", "space-md": "1rem" }, fontFamily: { "label-md": ["Inter"], "body-md-bold": ["Inter"], "body-lg": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-md": ["Inter"], "label-lg": ["Inter"], "caption": ["Inter"], "headline-lg": ["Inter"] }, fontSize: { "label-md": ["16px", { lineHeight: "22px", fontWeight: "600" }], "body-md-bold": ["18px", { lineHeight: "26px", fontWeight: "600" }], "body-lg": ["20px", { lineHeight: "28px", fontWeight: "500" }], "headline-sm": ["22px", { lineHeight: "30px", fontWeight: "600" }], "headline-md": ["26px", { lineHeight: "34px", fontWeight: "700" }], "body-md": ["18px", { lineHeight: "26px", fontWeight: "400" }], "label-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }], "caption": ["16px", { lineHeight: "22px", fontWeight: "500" }], "headline-lg": ["30px", { lineHeight: "38px", fontWeight: "700" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>

  </head><body class="bg-[#F7F7F5] font-body-md text-on-surface antialiased" style="background-color: #F7F7F5 !important;"><main class="flex flex-col relative w-full min-h-screen bg-[#F7F7F5] px-margin pt-safe pb-safe" style="background-color: #F7F7F5 !important;"><div class="flex flex-col w-full pb-8">
<!-- Top Navigation / Back Button -->
<div class="flex items-center justify-start mb-6">
<button aria-label="Geri dön" class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center active:scale-95 transition-transform cursor-pointer" type="button">
<span class="material-symbols-outlined text-secondary text-[28px]">arrow_back</span>
</button>
</div>
<!-- Header -->
<div class="flex flex-col mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 font-bold tracking-tight">Tekrar hoş geldiniz</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">E-posta adresiniz ve şifrenizle giriş yapın.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col w-full" onsubmit="event.preventDefault();">
<!-- Form Group 1: Email -->
<div class="flex flex-col mb-6">
<label class="font-body-md-bold text-body-md-bold text-on-surface mb-2.5" for="email">E-posta adresiniz</label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-14 bg-surface-container-lowest rounded-2xl px-4 font-body-md text-body-md text-on-surface placeholder:text-outline shadow-sm outline-none transition-all duration-150 focus:shadow-md" id="email" onblur="this.style.boxShadow = 'inset 0 0 0 1.5px #BFC8C6';" onfocus="this.style.boxShadow = 'inset 0 0 0 2px #0F6E6E';" placeholder="ornek@mail.com" style="box-shadow: inset 0 0 0 1.5px #BFC8C6;" type="email"/>
</div>
</div>
<!-- Form Group 2: Password -->
<div class="flex flex-col mb-3">
<label class="font-body-md-bold text-body-md-bold text-on-surface mb-2.5" for="password">Şifre</label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-14 bg-surface-container-lowest rounded-2xl pl-4 pr-14 font-body-md text-body-md text-on-surface placeholder:text-outline shadow-sm outline-none transition-all duration-150 focus:shadow-md" id="password" onblur="this.style.boxShadow = 'inset 0 0 0 1.5px #BFC8C6';" onfocus="this.style.boxShadow = 'inset 0 0 0 2px #0F6E6E';" placeholder="••••••••" style="box-shadow: inset 0 0 0 1.5px #BFC8C6;" type="password"/>
<button aria-label="Şifreyi göster veya gizle" class="absolute right-1.5 w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-secondary active:scale-95 transition-all cursor-pointer rounded-xl" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[26px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mb-8">
<a class="font-label-lg text-label-lg text-secondary underline active:opacity-75 transition-opacity py-1" href="#">Şifremi unuttum</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-secondary text-on-secondary rounded-2xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.99] transition-all cursor-pointer mb-8" style="background-color: #0F6E6E;" type="submit">
<span>Giriş yap</span>
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
</form>
<!-- Bottom Navigation Link -->
<div class="flex items-center justify-center text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
      Hesabınız yok mu? ·
      <a class="font-body-md-bold text-body-md-bold text-secondary underline active:opacity-75 transition-opacity" href="#" style="color: #0F6E6E;">Hesap oluştur</a>
</p>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>
</body></html>
