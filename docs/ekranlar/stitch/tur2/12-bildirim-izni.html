<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior-y:none;font-family:'Inter',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-tint": "#006a60", "on-secondary-fixed": "#002020", "on-primary-fixed": "#00201c", "outline-variant": "#bdc9c6", "inverse-on-surface": "#f3f0ef", "surface-container-highest": "#e5e2e1", "on-tertiary-fixed-variant": "#005312", "tertiary": "#1b6d24", "on-primary-fixed-variant": "#005048", "secondary-fixed-dim": "#85d4d3", "inverse-surface": "#313030", "primary": "#006a60", "on-tertiary-fixed": "#002204", "on-error": "#ffffff", "tertiary-fixed-dim": "#88d982", "on-secondary-container": "#0f6e6e", "surface-dim": "#dcd9d9", "surface-bright": "#fcf9f8", "surface-variant": "#e5e2e1", "on-tertiary": "#ffffff", "inverse-primary": "#73d8c8", "on-secondary": "#ffffff", "error-container": "#ffdad6", "error": "#ba1a1a", "secondary-container": "#9eeded", "secondary-fixed": "#a1f0ef", "on-surface-variant": "#3d4947", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "tertiary-fixed": "#a3f69c", "on-secondary-fixed-variant": "#004f50", "primary-fixed": "#90f4e4", "surface-container-high": "#eae7e7", "on-background": "#1c1b1b", "secondary": "#03696a", "outline": "#6d7a77", "primary-container": "#3fa89a", "on-surface": "#1c1b1b", "on-primary-container": "#003731", "primary-fixed-dim": "#73d8c8", "tertiary-container": "#5aa958", "on-tertiary-container": "#003909", "background": "#fcf9f8", "on-error-container": "#93000a", "surface-container": "#f0eded", "surface-container-low": "#f6f3f2", "surface": "#fcf9f8" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.5rem", "space-md": "1rem", "space-xl": "1.75rem", "gutter": "1rem", "space-sm": "0.75rem", "space-lg": "1.25rem", "margin": "1.25rem" }, "fontFamily": { "headline-md": ["Inter"], "body-md-bold": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "caption": ["Inter"], "label-lg": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"] }, "fontSize": { "headline-md": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "body-md-bold": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "label-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "38px", "fontWeight": "700" }], "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "caption": ["16px", { "lineHeight": "22px", "fontWeight": "500" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="min-h-screen bg-surface flex flex-col text-on-surface antialiased"><main class="flex-1 flex flex-col w-full px-margin pt-safe pb-safe bg-surface"><div class="flex flex-col w-full min-h-[calc(100vh-theme(spacing.margin)*2)] justify-between px-2 py-4">
<!-- Upper / Middle Explanatory Section -->
<div class="flex flex-col items-center w-full">
<!-- Tactile Visual Anchor: Soft Teal Notification Bell -->
<div class="relative flex items-center justify-center w-40 h-40 rounded-full bg-secondary-container/40 mb-8 shadow-sm transition-transform active:scale-95">
<!-- Ambient gentle ring pulse effect -->
<div class="absolute inset-0 rounded-full bg-secondary-container/20 animate-ping opacity-75 pointer-events-none"></div>
<!-- Primary 96px High-Contrast Bell Icon -->
<span class="material-symbols-outlined text-on-secondary-container select-none text-[96px] leading-none" style="font-variation-settings: 'FILL' 1;">
        notifications_active
      </span>
</div>
<!-- Main Title -->
<h1 class="font-headline-lg text-headline-lg text-center text-on-surface tracking-tight mb-4 max-w-xs sm:max-w-md">
      İlaç saatlerinizi kaçırmayın
    </h1>
<!-- Explanatory Subtitle -->
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-sm mx-auto mb-8">
      İlaç saatiniz geldiğinde telefonunuz size bildirim gönderir. Bunun için bildirimlere izin vermeniz gerekir.
    </p>
<!-- Dignified Benefit Summary Card -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-5 sm:p-6 shadow-sm space-y-4 mb-6">
<!-- Benefit 1 -->
<div class="flex items-center gap-3.5">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-secondary-container/40 shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[22px] font-bold" style="font-variation-settings: 'wght' 700;">
            check
          </span>
</div>
<span class="font-body-md-bold text-body-md-bold text-on-surface">
          İlaç saatinde hatırlatma
        </span>
</div>
<!-- Benefit 2 -->
<div class="flex items-center gap-3.5">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-secondary-container/40 shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[22px] font-bold" style="font-variation-settings: 'wght' 700;">
            check
          </span>
</div>
<span class="font-body-md-bold text-body-md-bold text-on-surface">
          Hangi ilacı, kaç tane alacağınız
        </span>
</div>
<!-- Benefit 3 -->
<div class="flex items-center gap-3.5">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-secondary-container/40 shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[22px] font-bold" style="font-variation-settings: 'wght' 700;">
            check
          </span>
</div>
<span class="font-body-md-bold text-body-md-bold text-on-surface">
          İnternet olmasa da çalışır
        </span>
</div>
</div>
</div>
<!-- Bottom Large Tactile Action Area -->
<div class="w-full space-y-3 mt-auto pt-2 pb-2">
<!-- Primary CTA: 56px Tall for senior motor accessibility -->
<button class="w-full h-14 bg-on-secondary-container text-on-secondary font-label-lg text-label-lg rounded-2xl flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-all cursor-pointer" id="btn-allow-notifications" type="button">
<span class="material-symbols-outlined text-[24px]">notifications_none</span>
<span>Bildirimlere izin ver</span>
</button>
<!-- Secondary Text Trigger: Easy tap target, gentle demeanor -->
<button class="w-full min-h-[48px] py-3 text-center text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface active:opacity-75 transition-colors cursor-pointer" id="btn-skip-notifications" type="button">
      Şimdi değil
    </button>
</div>
</div>
<script>
  (function() {
    const allowBtn = document.getElementById('btn-allow-notifications');
    const skipBtn = document.getElementById('btn-skip-notifications');

    if (allowBtn) {
      allowBtn.addEventListener('click', function() {
        if ('Notification' in window) {
          Notification.requestPermission().then(function(permission) {
            // Reassuring feedback
            allowBtn.innerHTML = '<span class="material-symbols-outlined text-[24px]">check_circle</span><span>İzin verildi</span>';
            allowBtn.classList.replace('bg-on-secondary-container', 'bg-tertiary');
          }).catch(function() {
            // Handled gracefully without alarming
          });
        }
      });
    }

    if (skipBtn) {
      skipBtn.addEventListener('click', function() {
        skipBtn.classList.add('opacity-50');
      });
    }
  })();
</script></main></body></html>
