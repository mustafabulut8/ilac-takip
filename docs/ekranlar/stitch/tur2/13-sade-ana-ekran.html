<div>

<!-- Section Label -->
<div class="mt-6">
<h2 class="text-[22px] leading-[30px] font-semibold text-[#3D4947]">

</div>
<!-- Big Hero Medicine Card -->
<div class="mt-3 bg-white rounded-[20px] p-5 shadow-[0_4px_16px_rgba(0,0,0,0.06)] flex flex-col">

<div class="w-full h-[180px] rounded-[16px] overflow-hidden bg-surface-container-low flex items-center justify-center">
<img alt="Metformin 1000 mg ilaç kutusu" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQ7lEbi1DkiQ9cy0ukAbAncrhv_lNuLxoMT45ur3fP0Cj03o9F-Fdd4nrarQzHOn5Ba-Ica81NPlasd6DUvHY8e_N06NLnQskzlDE4vvTV5B7gbRfuuLGk5zg6mis6LoipmyPgALKix6PEYcZMx0OeSFmi769CzRMddsCF-mIH5aBvgBk9K5inWFVA7UFH6pweM6jFrjE_s7yLywiJeXDPUjVZOJeU8JbqukhZo2N-">
</div>
<!-- Medicine Details -->
<div class="mt-5 flex flex-col">
<span class="text-[30px] leading-[36px] font-bold text-[#111827] break-words">
        Metformin 1000 mg
      </span>
<span class="text-[22px] leading-[30px] font-medium text-[#3D4947] mt-1.5">
        1 tablet · tok karnına
      </span>

<div class="mt-4 flex items-center gap-2.5 text-[#0F6E6E]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">

        </span>
<span class="text-[26px] leading-[32px] font-bold">
          Saat 09:00
        </span>
</div>
</div>
</div>

<div class="mt-5">
<button class="w-full h-[72px] rounded-[16px] bg-[#0F6E6E] active:bg-[#005048] shadow-[0_6px_20px_rgba(15,110,110,0.25)] flex items-center justify-center gap-3 transition-transform active:scale-[0.98]" id="take-pill-btn" type="button">
<span class="material-symbols-outlined text-white text-[32px] font-bold">

      </span>
<span class="text-[28px] leading-[34px] font-bold text-white tracking-wide">
        İçtim
      </span>
</button>
</div>

<div class="mt-7 flex flex-col">

<div class="w-full h-[12px] bg-[#E6ECEB] rounded-full overflow-hidden mt-2.5">

</div>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('take-pill-btn');
    if (btn) {
      btn.addEventListener('click', function() {
        this.classList.add('bg-[#2E7D32]');
        this.innerHTML = `
          <span class="material-symbols-outlined text-white text-[32px]">task_alt</span>
          <span class="text-[28px] leading-[34px] font-bold text-white">Alındı</span>
        `;
        setTimeout(() => {
          this.style.pointerEvents = 'none';
          this.classList.add('opacity-90');
        }, 300);
      });
    }
  })();
