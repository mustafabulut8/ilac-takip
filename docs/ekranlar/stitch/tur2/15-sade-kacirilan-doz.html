<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container": "#f0eded", "primary-container": "#3fa89a", "inverse-on-surface": "#f3f0ef", "on-primary-container": "#003731", "secondary-container": "#9eeded", "on-secondary-fixed": "#002020", "on-secondary-container": "#0f6e6e", "on-background": "#1c1b1b", "on-secondary": "#ffffff", "surface-variant": "#e5e2e1", "secondary": "#03696a", "on-tertiary": "#ffffff", "tertiary-container": "#5aa958", "on-error": "#ffffff", "background": "#fcf9f8", "outline-variant": "#bdc9c6", "primary": "#006a60", "on-primary-fixed": "#00201c", "tertiary-fixed": "#a3f69c", "error": "#ba1a1a", "on-primary": "#ffffff", "surface-container-low": "#f6f3f2", "surface-tint": "#006a60", "secondary-fixed-dim": "#85d4d3", "tertiary": "#1b6d24", "on-primary-fixed-variant": "#005048", "on-tertiary-fixed-variant": "#005312", "on-surface-variant": "#3d4947", "surface-container-highest": "#e5e2e1", "on-tertiary-fixed": "#002204", "outline": "#6d7a77", "inverse-primary": "#73d8c8", "inverse-surface": "#313030", "on-secondary-fixed-variant": "#004f50", "surface-container-high": "#eae7e7", "on-error-container": "#93000a", "secondary-fixed": "#a1f0ef", "on-surface": "#1c1b1b", "primary-fixed-dim": "#73d8c8", "tertiary-fixed-dim": "#88d982", "surface-dim": "#dcd9d9", "surface": "#fcf9f8", "on-tertiary-container": "#003909", "primary-fixed": "#90f4e4", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "surface-bright": "#fcf9f8" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.25rem", "margin": "1.25rem", "space-sm": "0.75rem", "space-xl": "1.75rem", "gutter": "1rem", "space-md": "1rem", "space-xs": "0.5rem" }, "fontFamily": { "headline-md": ["Inter"], "headline-lg": ["Inter"], "headline-sm": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "body-md-bold": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"], "caption": ["Inter"] }, "fontSize": { "headline-md": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "headline-lg": ["30px", { "lineHeight": "38px", "fontWeight": "700" }], "headline-sm": ["22px", { "lineHeight": "30px", "fontWeight": "600" }], "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }], "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "body-md-bold": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "label-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "label-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "caption": ["16px", { "lineHeight": "22px", "fontWeight": "500" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;background-color:#F7F7F5;color:#1c1b1b;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="min-h-screen flex flex-col font-body-md text-body-md bg-[#F7F7F5] pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full px-margin"><div class="flex flex-col w-full pb-8 select-none">
<!-- Top Bar: Greeting & Settings Button -->
<div class="flex items-center justify-between pt-2 pb-1">
<div class="flex flex-col">
<h1 class="text-[34px] leading-[40px] font-bold text-on-surface tracking-tight">Günaydın Mustafa</h1>
<p class="text-[20px] leading-[28px] text-on-surface-variant font-medium mt-1">Çarşamba, 25 Kasım</p>
</div>
<button aria-label="Ayarlar" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container active:bg-surface-container-high transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[30px] text-on-surface-variant">settings</span>
</button>
</div>
<!-- Status Section: Next Medicine & Overdue Pill Badge -->
<div class="mt-6 flex flex-wrap items-center justify-between gap-2.5">
<span class="text-[22px] leading-[28px] font-semibold text-on-surface-variant">Sıradaki ilacınız</span>
<div class="bg-error-container text-error text-[20px] leading-[26px] font-bold px-4 py-1.5 rounded-full inline-flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span>Saati geçti</span>
</div>
</div>
<!-- Overdue Medicine Card -->
<div class="mt-3.5 bg-surface-container-lowest rounded-[20px] p-5 shadow-[0_4px_16px_rgba(0,0,0,0.06)] flex flex-col">
<!-- Medicine Box Photo -->
<div class="w-full h-[180px] rounded-[16px] overflow-hidden bg-surface-container">
<img alt="Metformin 1000 mg kutusu" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ALJJyrBICsPRqYAGz-Kb0vSvMhjrKeBKyMaBjVqKaSGmSESYE7sgbI1Ag9mfesmD3b6eYcn9LSORYn2Q5YyhpYz4W6WLVZKGGGWLOV0HDkLDJDgIKgjnTEFI6vQiSEYxMDxeupx8lGpmL9a356lR68HxNk5BCYQL7UCEmsMU0EIKfeJoYa5_nZItX8qCiUDKvOdCQQhOaMVSPyjZ63uZlBx0L4iKM3TiWsEgTMI78fNwBkp9"/>
</div>
<!-- Medicine Title & Dose Details -->
<h2 class="text-[30px] leading-[36px] font-bold text-on-surface mt-4">Metformin 1000 mg</h2>
<p class="text-[22px] leading-[30px] text-on-surface-variant font-medium mt-1">1 tablet · tok karnına</p>
<!-- Missed Time Indicator -->
<div class="mt-4 pt-3 flex items-center gap-2 text-error">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="text-[24px] leading-[30px] font-bold">Saat 09:00 · 45 dakika geçti</span>
</div>
</div>
<!-- Large Primary Action Button: "İçtim" -->
<button class="w-full h-[72px] mt-6 bg-on-secondary-container active:scale-[0.98] text-white rounded-[16px] font-bold text-[28px] flex items-center justify-center gap-3 shadow-[0_4px_16px_rgba(15,110,110,0.3)] transition-transform duration-100 focus:outline-none" id="btn-taken" type="button">
<span class="material-symbols-outlined text-[36px] stroke-2">check_circle</span>
<span>İçtim</span>
</button>
<!-- Secondary Action Button: "Bu dozu atla" -->
<button class="w-full py-3 mt-2 text-on-surface-variant font-semibold text-[20px] leading-[28px] text-center hover:underline active:opacity-75 focus:outline-none transition-opacity" id="btn-skip" type="button">
    Bu dozu atla
  </button>
<!-- Progress Section: Daily Adherence -->
<div class="mt-4 pt-2 flex flex-col">
<div class="flex items-center justify-between">
<span class="text-[20px] leading-[28px] font-semibold text-on-surface-variant">Bugün 1 / 3 ilaç alındı</span>
</div>
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden mt-3">
<div class="h-full bg-on-secondary-container rounded-full" style="width: 33.33%;"></div>
</div>
</div>
</div>
<script>
  (function() {
    const btnTaken = document.getElementById('btn-taken');
    const btnSkip = document.getElementById('btn-skip');

    if (btnTaken) {
      btnTaken.addEventListener('click', function() {
        btnTaken.classList.add('opacity-90');
        btnTaken.innerHTML = `
          <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">check</span>
          <span>Kaydedildi</span>
        `;
        setTimeout(() => {
          btnTaken.classList.remove('opacity-90');
        }, 800);
      });
    }

    if (btnSkip) {
      btnSkip.addEventListener('click', function() {
        if (confirm("Bu dozu atlamak istediğinizden emin misiniz?")) {
          btnSkip.textContent = "Doz atlandı";
          btnSkip.classList.add('text-outline');
        }
      });
    }
  })();
</script></main></body></html>
